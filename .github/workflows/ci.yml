name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install test dependency (domino)
        run: npm install --no-audit --no-fund

      - name: Run self-tests
        run: npm test
        env:
          DSH_HOME: ${{ runner.temp }}\dsh-home-ci
